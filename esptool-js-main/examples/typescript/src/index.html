<!DOCTYPE html>
<!-- 文档类型声明，定义该文件为 HTML5 文档 -->
<html>
    <head>
        <!-- head 部分包含了文档的元数据，是网页的“头部” -->
        <meta charset="utf-8" />
        <!-- 指定文档的字符编码为 UTF-8，这是目前最常用的字符编码方案，可以显示中文等多种语言 -->
        <title>ESP Tool</title>
        <!-- 设置网页的标题，会显示在浏览器的标签页上 -->

        <!-- 链接外部 CSS 样式表 -->
        <!-- 引入 Bootstrap 框架的 CSS，用于美化界面和响应式布局 -->
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <!-- 引入 xterm.js 的 CSS，用于在网页中创建一个仿真的终端界面 -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4.19.0/css/xterm.css">
        <!-- 引入 Google 字体 "Orbitron" -->
        <link
            href="https://fonts.googleapis.com/css?family=Orbitron"
            rel="stylesheet"
        />
        <!-- 设置网站的收藏夹图标（favicon），显示在浏览器标签页标题的左侧 -->
        <link rel="icon" href="../assets/favicon.ico" />

         <!-- 引入外部 JavaScript 库 -->
         <!-- 引入 xterm.js 库，用于实现网页终端功能 -->
         <script src="https://cdn.jsdelivr.net/npm/xterm@4.19.0/lib/xterm.min.js"></script>
         <!-- 引入 crypto-js 库，用于处理加密相关的操作 -->
         <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
         <!-- 引入 jQuery 库，一个流行的 JavaScript 库，简化了 DOM 操作、事件处理等 -->
         <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
         <!-- 引入 Bootstrap 框架的 JavaScript 部分，为一些组件（如弹窗、下拉菜单）提供交互功能 -->
         <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    </head>
    <body>
        <!-- body 部分是网页的主体内容，用户在浏览器中看到的所有东西都在这里 -->

        <!-- 创建一个居中的一级标题 -->
        <h1 align="center">
            <p>
                <!-- 插入一个图片，并设置其垂直对齐方式 -->
                <img src="../assets/esp-logo.png" width="42" height="42" style="vertical-align:middle" crossorigin></img>
                <!-- 标题文本 -->
                ESP Tool
            </p>
        </h1>
        <!-- 创建一个居中的四级标题，作为工具的副标题/描述 -->
        <h4 align="center">一个为乐鑫芯片设计的串口烧录工具</h4>

        <!-- 这是一个专门为 Safari 浏览器准备的错误提示，默认是隐藏的 (display:none) -->
        <div id="safariErr" style="display:none">
            <p align="center" style="color:red">Safari 浏览器不支持此工具！</p>
        </div>

        <!-- 一个居中的 div 容器 -->
        <div align="center">
            <!-- 一个链接按钮，点击后会跳转到 API 文档页面 -->
            <a class="btn btn-info" href="./docs/index.html">查看 API 文档</a>

            <!-- “form-check” 是 Bootstrap 的一个样式类，用于美化复选框和单选按钮 -->
            <div class="form-check form-check-inline">
                <!-- 复选框 -->
                <input class="form-check-input" type="checkbox" id="debugLogging" value="">
                <!-- 复选框的标签 -->
                <label class="form-check-label" for="debugLogging">显示调试日志</label>
            </div>
          </div>

        <!-- 主内容容器，使用了 Bootstrap 的 container 类来实现响应式布局 -->
        <div class="container" id="main">
            <hr/> <!-- 水平分割线 -->

            <!-- "Program" (烧录) 功能区 -->
            <div id="program">
                <h3>烧录</h3>
                <!-- "Baudrate" (波特率) 的标签 -->
                <label for="baudrates" id="lblBaudrate">波特率:</label>
                <!-- 一个默认隐藏的标签，用于显示连接的设备信息 -->
                <label style="display:none" id="lblConnTo">已连接到设备: </label>
                <!-- 波特率选择下拉菜单 -->
                <select name="baudrates" id="baudrates">
                    <option value="921600">921600</option>
                    <option value="460800">460800</option>
                    <option value="230400">230400</option>
                    <option value="115200" selected>115200</option> <!-- "selected" 表示这是默认选项 -->
                </select>

                <br><br> <!-- 两个换行符，用于增加垂直间距 -->

                <!-- 操作按钮 -->
                <input class="btn btn-info btn-sm" type="button" id="connectButton" value="连接" />
                <input class="btn btn-info btn-sm" type="button" id="copyTraceButton" value="复制追踪信息" />
                <input class="btn btn-warning btn-sm" type="button" id="disconnectButton" value="断开连接" />
                <input class="btn btn-danger btn-sm" type="button" id="eraseButton" value="擦除 Flash" />
                <br> <!-- 换行符 -->

                <!-- 警告信息显示区域，默认隐藏 -->
                <div class="alert alert-danger alert-dismissible" id="alertDiv" style="display:none; margin-top:10px">
                    <!-- 关闭按钮 -->
                    <a href="#" class="close" aria-label="close" onclick="$('.alert').hide()">&times;</a>
                    <!-- 警告信息的具体内容将通过 JavaScript 填充到这里 -->
                    <span id="alertmsg"></span>
                </div>

                <!-- 文件选择和烧录区域 -->
                <div id="files">
                    <!-- 文件列表表格 -->
                    <table class="table table-striped" id="fileTable">
                        <!-- 表头 -->
                        <thead class="thead-light">
                            <tr>
                                <th>Flash 地址</th>
                                <th>文件</th>
                                <th></th> <!-- 留空，可能用于放置删除按钮等操作 -->
                            </tr>
                        </thead>
                        <!-- 表格主体，内容将由 JavaScript 动态添加 -->
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                    <!-- 添加文件和烧录按钮 -->
                    <input class="btn btn-info btn-sm" type="button" id="addFile" value="添加文件" />
                    <input class="btn btn-info btn-sm" type="button" id="programButton" value="烧录" />
                </div>
                <!-- <output> 标签用于显示某些计算或操作的结果 -->
                <output id="list"></output>
                <hr/> <!-- 水平分割线 -->
            </div>

            <!-- "Console" (控制台/终端) 功能区 -->
            <div id="console">
                <h3>控制台</h3>
                 <!-- 一个默认隐藏的标签，用于显示连接的设备信息 -->
                <label style="display:none" id="lblConsoleFor">已连接到设备: </label>
                 <!-- "Baudrate" (波特率) 的标签 -->
                <label for="consoleBaudrates" id="lblConsoleBaudrate">波特率:</label>
                <!-- 控制台波特率选择下拉菜单 -->
                <select name="consoleBaudrates" id="consoleBaudrates">
                    <option value="115200">115200</option>
                    <option value="74880">74880</option>
                </select>

                <br><br> <!-- 增加垂直间距 -->

                <!-- 控制台操作按钮 -->
                <input class="btn btn-info" type="button" id="consoleStartButton" value="开始" />
                <input class="btn btn-info" type="button" id="consoleStopButton" value="停止" />
                <input class="btn btn-info" type="button" id="resetButton" value="复位" />
                <hr/> <!-- 水平分割线 -->
            </div>

            <!-- 终端显示区域，xterm.js 会将终端渲染到这个 div 中 -->
            <div id="terminal"></div>
        </div>

        <!-- 引入主要的 TypeScript/JavaScript 逻辑文件。"type=module" 表示这是一个 ES6 模块 -->
        <script src="index.ts" type="module"></script>

        <!-- 内联 JavaScript 代码块 -->
        <script>
            // 这段代码用于检测用户是否正在使用 Safari 浏览器
            // Safari 3.0+ 的一个特征是 HTMLElement 构造函数会返回 "[object HTMLElementConstructor]"
            var isSafari = /constructor/i.test(window.HTMLElement) || (function (p) { return p.toString() === "[object SafariRemoteNotification]"; })(!window['safari'] || (typeof safari !== 'undefined' && window['safari'].pushNotification));

            // 如果检测到是 Safari 浏览器
            if(isSafari)
            {
               // 显示之前隐藏的 Safari 错误提示
               document.getElementById("safariErr").style.display = "inline";
               // 隐藏主内容区域
               document.getElementById("main").style.display = "none";
            }
        </script>
    </body>
</html>
